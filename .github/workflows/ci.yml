name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Product tests (no key, no network)
        run: pytest -q tests
        env:
          OPENROUTER_API_KEY: ""
      - name: HW1 tests
        run: pytest -q hw1
